name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir -p release

          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o release/picoseal-${{ github.ref_name }}-linux-$arch .
          done

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
